name: Build iOS Release IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15  # macOS ARM64 runner

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI workload
      run: dotnet workload install maui ios

    - name: Decode signing certificate
      run: |
        echo "" | base64 --decode > ios_cert.p12
        echo "" | base64 --decode > ios_profile.mobileprovision

    - name: Install certificate to keychain
      run: |
        security create-keychain -p "1" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "1" build.keychain
        security import ios_cert.p12 -k build.keychain -P "1" -A

    - name: Install Provisioning Profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        uuid=$(grep -aom1 -E '<key>UUID</key><string>.*</string>' ios_profile.mobileprovision | sed -e 's/<key>UUID<\/key><string>//' -e 's/<\/string>//')
        cp ios_profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/$uuid.mobileprovision
        ls -l ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles

    - name: Build IPA
      run: |
        dotnet publish "SurvivalCraft.IOS/SurvivalCraft.IOS.csproj" \
          -c Release \
          -p:CodesignKey="iPhone Distribution" \
          -p:CodesignProvision=$uuid \
          -p:RuntimeIdentifier=ios-arm64

    - name: Archive Bin Files
      run: |
        mkdir SurvivalCraft.IOS/bin/Release/net9.0-ios18.0/ios-arm64/Payload
        mv SurvivalCraft.IOS/bin/Release/net9.0-ios18.0/ios-arm64/Survivalcraft.app SurvivalCraft.IOS/bin/Release/net9.0-ios18.0/ios-arm64/Payload
        cd SurvivalCraft.IOS/bin/Release/net9.0-ios18.0/ios-arm64
        zip -r build.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: SurvivalCraft.ipa
        path: "SurvivalCraft.IOS/bin/Release/net9.0-ios18.0/ios-arm64/build.ipa"
